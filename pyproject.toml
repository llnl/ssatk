[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssatk"
version = "1.1.1"
description = "Space Situational Awareness Toolkit (SSATK): orbit and 6-DoF propagation, transfer design, frames, space environment, conjunction screening, data I/O and visualization"
authors = [
  { name = "Travis R. Yeager", email = "yeagerastro@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
keywords = ["orbital-mechanics", "astrodynamics", "visualization", "utilities"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "astropy",
  "h5py",
  "imageio",
  "llnl-ssapy>=1.1.11",
  "ssatk-data-core==0.0.1",
  "ssatk-data-gravity==0.0.1",
  "ssatk-data-lunar==0.0.1",
  "ssatk-data-lunar-gravity==0.0.1",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "plotly",
  "pyerfa",
  "rebound",
  "scipy",
]

[project.optional-dependencies]
monitoring = [
  "psutil",
]

propulsion = ["ssatk-data-propulsion==0.0.1"]
benchmarks = ["ssatk-data-benchmarks==0.0.1"]
all-data = [
  "ssatk-data-core==0.0.1",
  "ssatk-data-gravity==0.0.1",
  "ssatk-data-lunar==0.0.1",
  "ssatk-data-lunar-gravity==0.0.1",
  "ssatk-data-propulsion==0.0.1",
  "ssatk-data-benchmarks==0.0.1",
]

notebook = [
  "ipython",
  "ipyvolume",
]

static = [
  "kaleido",
]

browser = [
  "selenium",
]

pdf = [
  "pypdf",
]

video = [
  "imageio-ffmpeg",
  "opencv-python",
]

geomagnetics = [
  "ppigrf",
  "geopack",
]

atmosphere = [
  "pymsis>=0.12",
]

validation = [
  "spacepy",
]

dev = [
  "coverage",
  "ipython",
  "ipyvolume",
  "kaleido",
  "pytest",
  "pytest-mpi",
  "sphinx",
  "sphinx-rtd-theme",
  "myst-parser<4.0.0",
  "nodeenv",
  "imageio-ffmpeg",
  "opencv-python",
  "pypdf",
  "psutil",
  "ruff",
  "selenium",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/LLNL/ssatk"
Repository = "https://github.com/LLNL/ssatk"
Issues = "https://github.com/LLNL/ssatk/issues"
Documentation = "https://ssatk.readthedocs.io/"

[tool.setuptools]
packages = { find = { where = ["."], include = ["ssatk*", "demos*"] } }

[tool.setuptools.package-data]
demos = ["README.md"]
"demos.benchmarks" = ["README.md", "orekit/*.java", "orekit/*.xml"]
"ssatk.plots" = ["*.js"]

[tool.pytest.ini_options]
markers = [
  "slow: demo smoke tests that may render media or run longer workflows",
]
filterwarnings = [
  "ignore:Jupyter is migrating its paths.*:DeprecationWarning",
  "ignore:Parsing dates involving a day of month without a year specified is ambiguious.*:DeprecationWarning",
]

[project.scripts]
ssatk-demo-gallery = "ssatk.run_all_demos:main"
ssatk-benchmark = "ssatk.benchmark:main"
ssatk-magnetosphere = "ssatk.plots.magfield_plot_3d:main"
ssatk-bake-moon = "ssatk.io.moon_maps:main"
# Pre-rename command names, kept so existing scripts keep working.
ssapy-demo-gallery = "ssatk.run_all_demos:main"
ssapy-magnetosphere = "ssatk.plots.magfield_plot_3d:main"
ssapy-bake-moon = "ssatk.io.moon_maps:main"
