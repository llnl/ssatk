[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssapy-toolkit"
version = "1.0.5"
description = "SSAPy Toolkit: extensions for orbital mechanics, plotting, and data IO"
authors = [
  { name = "Travis R. Yeager", email = "yeagerastro@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
keywords = ["orbital-mechanics", "astrodynamics", "visualization", "utilities"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "astropy",
  "h5py",
  "imageio",
  "llnl-ssapy-data>=0.1.5",
  "llnl-ssapy>=1.1.9",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "plotly",
  "pyerfa",
  "rebound",
  "scipy",
]

[project.optional-dependencies]
monitoring = [
  "psutil",
]

notebook = [
  "ipython",
  "ipyvolume",
]

static = [
  "kaleido",
]

browser = [
  "selenium",
]

pdf = [
  "pypdf",
]

video = [
  "imageio-ffmpeg",
  "opencv-python",
]

geomagnetics = [
  "ppigrf",
  "geopack",
]

atmosphere = [
  "pymsis>=0.12",
]

validation = [
  "spacepy",
]

dev = [
  "coverage",
  "ipython",
  "ipyvolume",
  "kaleido",
  "pytest",
  "pytest-mpi",
  "sphinx",
  "sphinx-rtd-theme",
  "myst-parser<4.0.0",
  "nodeenv",
  "imageio-ffmpeg",
  "opencv-python",
  "pypdf",
  "psutil",
  "ruff",
  "selenium",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/llnl/SSAPy-Toolkit"
Repository = "https://github.com/llnl/SSAPy-Toolkit"
Issues = "https://github.com/llnl/SSAPy-Toolkit/issues"
Documentation = "https://ssapy-toolkit.readthedocs.io/"

[tool.setuptools]
packages = { find = { where = ["."], include = ["ssapy_toolkit*", "demos*"] } }

[tool.setuptools.package-data]
demos = ["README.md"]
"demos.benchmarks" = ["README.md", "orekit/*.java", "orekit/*.xml"]
"ssapy_toolkit.plots" = ["*.js", "eclipse_three_license.txt"]

[tool.pytest.ini_options]
markers = [
  "slow: demo smoke tests that may render media or run longer workflows",
]
filterwarnings = [
  "ignore:Jupyter is migrating its paths.*:DeprecationWarning",
  "ignore:Parsing dates involving a day of month without a year specified is ambiguious.*:DeprecationWarning",
]

[project.scripts]
ssapy-demo-gallery = "ssapy_toolkit.run_all_demos:main"
ssatk-benchmark = "ssapy_toolkit.benchmark:main"
ssapy-magnetosphere = "ssapy_toolkit.plots.magfield_plot_3d:main"
ssapy-bake-moon = "ssapy_toolkit.io.moon_maps:main"
ssapy-eclipse = "ssapy_toolkit.eclipse_cli:main"
