name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geomagnetics,atmosphere,propulsion]"
          pip install --no-deps -e packaging/ssapy-toolkit-compat

      - name: Validate JavaScript plot assets
        run: |
          node --check ssatk/plots/satellite_viewer_scene.js
          node --check ssatk/plots/satellite_viewer_smoketest.js

      - name: Run tests
        run: pytest tests

      - name: Run analytical validation profile
        if: matrix.python-version == '3.13'
        run: python -m ssatk.benchmark --profile validation --quick --no-dashboard --fail-on-validation --output-dir .ci-output/benchmark-validation

      - name: Upload analytical validation results
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: analytical-validation-python-${{ matrix.python-version }}
          path: .ci-output/benchmark-validation/benchmark_results.json
          if-no-files-found: error
