name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: ["numpy"]
        include:
          - python-version: "3.10"
            numpy: "numpy==1.26.4"
            os: ubuntu-24.04
          - python-version: "3.13"
            numpy: "numpy"
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up MSVC for the SSAPy source build
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || 'Unix Makefiles' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geomagnetics,atmosphere,propulsion]" "${{ matrix.numpy }}"

      - name: Check Ruff syntax gate
        if: matrix.python-version == '3.13'
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Validate JavaScript plot assets
        run: |
          node --check ssatk/plots/satellite_viewer_scene.js
          node --check ssatk/plots/satellite_viewer_smoketest.js
          node --check ssatk/plots/solar_sky.js
          node --check ssatk/plots/eclipse_cinematic_runtime.js

      - name: Run tests
        run: pytest tests

      - name: Check rendering on the installed Matplotlib version
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest -q
          scripts/tests/test_globe_rendering.py
          scripts/tests/test_body_rendering_modes.py
          scripts/tests/test_moon_plot_rendering.py
          scripts/tests/test_cislunar_framing.py
          scripts/tests/test_orbit_occultation.py

      - name: Run analytical validation profile
        id: benchmark-validation
        if: matrix.python-version == '3.13'
        run: python -m ssatk.benchmark --profile validation --quick --no-dashboard --fail-on-validation --output-dir .ci-output/benchmark-validation

      - name: Upload analytical validation results
        if: always() && steps.benchmark-validation.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: analytical-validation-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: .ci-output/benchmark-validation/benchmark_results.json
          if-no-files-found: error

  external-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install toolkit and Orekit reference runtime
        run: |
          python -m pip install -e ".[dev]"
          mvn -B -q -f demos/benchmarks/orekit/pom.xml dependency:build-classpath
      - name: Require independent Orekit position and velocity references
        run: python -m scripts.external_validation_report --case orekit_two_body --require-external --output external-validation.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: external-validation
          path: external-validation.json
          if-no-files-found: error
