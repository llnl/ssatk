name: Eclipse checks
on:
  pull_request:
    paths:
      - 'ssatk/**/eclipse*.py'
      - 'ssatk/plots/eclipse_*.js'
      - 'ssatk/plots/moon_*.py'
      - 'demos/eclipse/**'
      - 'tests/test_eclipse*.py'
      - 'tests/test_gcrf_itrf_roundtrip.py'
      - '.github/workflows/eclipse-ci.yml'
  workflow_dispatch:
jobs:
  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Repository policy
        run: python scripts/check_repository_policy.py
      - name: Eclipse and coordinate tests
        run: >
          python -m pytest -q
          tests/test_eclipse_integration.py
          tests/test_eclipse_renderer_api.py
      - name: Package imports with no failures
        run: >
          python -c "import ssatk.plots, ssatk.eclipse; print('imports clean')"
      - name: Eclipse CLI resolves
        run: |
          ssatk-eclipse --help > /dev/null
          ssatk-eclipse audit --output "${RUNNER_TEMP}/audit.json"
