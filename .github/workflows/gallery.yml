name: Build Demo Gallery

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull requests get their own group so they never cancel a Pages deploy.
  group: ${{ github.event_name == 'pull_request' && format('gallery-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all-data]"

      - name: Validate JavaScript plot assets
        run: |
          node --check ssatk/plots/satellite_viewer_scene.js
          node --check ssatk/plots/satellite_viewer_smoketest.js

      - name: Build demo gallery
        env:
          MPLBACKEND: Agg
        run: |
          ssatk-demo-gallery --output site

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
