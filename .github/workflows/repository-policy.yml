name: Repository Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check repository layout and artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="$PR_BASE_SHA"
            HEAD_REF="HEAD"
          else
            BASE_REF="$PUSH_BEFORE_SHA"
            HEAD_REF="$GITHUB_SHA"
            if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="$(git rev-list --max-parents=0 "$HEAD_REF")"
            fi
          fi
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            # A force push leaves the old head unreachable from every ref, so
            # checkout does not fetch it; GitHub still serves it by SHA.
            git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null || true
          fi
          if git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            # Equal to BASE_REF for ordinary pushes and pull requests; after a
            # history rewrite, the last commit both heads share, so every
            # rewritten commit is checked rather than only the newest one.
            BASE_REF="$(git merge-base "$BASE_REF" "$HEAD_REF")"
          else
            echo "Base commit $BASE_REF is unavailable; checking the rewritten head against its parent."
            BASE_REF="$(git rev-parse "$HEAD_REF^")"
          fi

          python scripts/check_repository_policy.py --base-ref "$BASE_REF" --head-ref "$HEAD_REF"

      - name: Check release metadata agrees
        run: python scripts/check_release_metadata.py

      - name: Check diff for conflict markers and whitespace errors
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$PR_BASE_SHA"
          fi
          # Diff against the merge-base, not the base branch tip, so only the
          # pull request's own changes are checked even if main has moved on.
          BASE_REF="$(git merge-base "$PR_BASE_SHA" HEAD)"
          git diff --check "$BASE_REF" HEAD
