name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,propulsion]"

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release only commits that main contains (v1.1.3 was cut from a
          # PR branch, so main never received its version bump).
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$RELEASE_TAG is not on main; merge first, then tag a commit on main."; exit 1; }
          # pyproject.toml, codemeta.json, CITATION.cff and the ssapy-toolkit
          # compatibility package must all carry the tag's version.
          python scripts/check_release_metadata.py --tag "$RELEASE_TAG"

      - name: Find the previous release on main
        id: previous
        run: |
          set -euo pipefail
          # Lint and policy checks cover everything since the last release
          # reachable from this tag. merge-base(origin/main, HEAD) equals HEAD
          # for a tag on main, which left those checks with nothing to check.
          if previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null)"; then
            echo "ref=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff syntax checks
        env:
          BASE_REF: ${{ steps.previous.outputs.ref }}
        run: |
          set -euo pipefail
          echo "Checking Python files changed since $BASE_REF"
          base_ref="$BASE_REF"
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$base_ref" HEAD -- '*.py'
          )
          if ((${#python_files[@]})); then
            ruff check --select E9,F63,F7,F82 "${python_files[@]}"
          fi

      - name: Check repository policy
        env:
          BASE_REF: ${{ steps.previous.outputs.ref }}
        run: python scripts/check_repository_policy.py --base-ref "$BASE_REF" --head-ref HEAD

      - name: Run analytical validation profile
        run: python -m ssatk.benchmark --profile validation --quick --no-dashboard --fail-on-validation --output-dir .ci-output/benchmark-validation

      - name: Upload analytical validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analytical-validation-release
          path: .ci-output/benchmark-validation/benchmark_results.json
          if-no-files-found: error

  build-and-publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ssatk
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: |
          python -m build
          python -m build packaging/ssapy-toolkit-compat --outdir dist-compat

      - name: Check distributions
        run: python -m twine check dist/* dist-compat/*

      - name: Smoke-test wheel
        run: |
          # Install the wheel with its declared dependencies, exactly as a user
          # would, so a missing or misnamed ssa-data-* package fails here.
          pip install dist/ssatk-*.whl
          python -I - <<'PY'
          from importlib.metadata import entry_points, version
          from importlib.util import find_spec

          import ssatk
          from ssatk.data import data_resource, resource_package
          from ssatk.plots._textures import earth_texture_path
          from ssatk.plots.starfield import find_data_file

          # The retired single-wheel archive must not be what makes this pass.
          assert find_spec("ssapy_data") is None, "llnl-ssapy-data leaked into the release env"
          assert ssatk.__version__ == version("ssatk")
          for name in ("environment/eop/finals2000A.all",
                       "environment/space_weather/SW-All.csv",
                       "earth_map.npz", "bright_stars.csv"):
              assert data_resource(name).is_file(), name
              assert resource_package(name) == "ssa_data_core", name
          assert find_data_file("bright_stars.csv") is not None
          assert earth_texture_path().is_file()
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          assert {"ssatk-demo-gallery", "ssatk-benchmark", "ssatk-magnetosphere"} <= scripts
          assert find_spec("ssapy_toolkit") is None, "the ssatk wheel must not ship the legacy alias"
          PY

      - name: Smoke-test ssapy-toolkit compatibility wheel
        run: |
          # ssatk is already installed from dist/, so --no-deps checks this
          # wheel against the release being published rather than PyPI.
          pip install --no-deps dist-compat/ssapy_toolkit-*.whl
          python -I - <<'PY'
          import warnings
          from importlib.metadata import requires, version

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import ssapy_toolkit
              import ssapy_toolkit.coordinates.frames as frames_old
          import ssatk
          import ssatk.coordinates.frames as frames_new

          assert any(issubclass(w.category, FutureWarning) for w in caught)
          assert version("ssapy-toolkit") == version("ssatk") == ssatk.__version__
          assert requires("ssapy-toolkit") == [f"ssatk=={ssatk.__version__}"], requires("ssapy-toolkit")
          assert ssapy_toolkit.__version__ == ssatk.__version__
          assert frames_old.eci_to_ecf_matrix is frames_new.eci_to_ecf_matrix
          PY

      - name: Publish ssatk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish ssapy-toolkit compatibility package to PyPI
        # Needs a PyPI trusted publisher for ssapy-toolkit naming LLNL/ssatk,
        # publish.yml and the pypi environment.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-compat/
