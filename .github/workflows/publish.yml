name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,propulsion]"

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with (Path("pyproject.toml")).open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          test "$RELEASE_TAG" = "v$project_version"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff syntax checks
        run: |
          set -euo pipefail
          base_ref="$(git merge-base origin/main HEAD)"
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$base_ref" HEAD -- '*.py'
          )
          if ((${#python_files[@]})); then
            ruff check --select E9,F63,F7,F82 "${python_files[@]}"
          fi

      - name: Check repository policy
        run: python scripts/check_repository_policy.py --base-ref "$(git merge-base origin/main HEAD)" --head-ref HEAD

      - name: Run analytical validation profile
        run: python -m ssatk.benchmark --profile validation --quick --no-dashboard --fail-on-validation --output-dir .ci-output/benchmark-validation

      - name: Upload analytical validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytical-validation-release
          path: .ci-output/benchmark-validation/benchmark_results.json
          if-no-files-found: error

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssatk
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          # Install the wheel with its declared dependencies, exactly as a user
          # would, so a missing or misnamed ssa-data-* package fails here.
          pip install dist/ssatk-*.whl
          python -I - <<'PY'
          from importlib.metadata import entry_points, version
          from importlib.util import find_spec

          import ssatk
          from ssatk.data import data_resource, resource_package
          from ssatk.plots._textures import earth_texture_path
          from ssatk.plots.starfield import find_data_file

          # The retired single-wheel archive must not be what makes this pass.
          assert find_spec("ssapy_data") is None, "llnl-ssapy-data leaked into the release env"
          assert ssatk.__version__ == version("ssatk")
          for name in ("environment/eop/finals2000A.all",
                       "environment/space_weather/SW-All.csv",
                       "earth_map.npz", "bright_stars.csv"):
              assert data_resource(name).is_file(), name
              assert resource_package(name) == "ssa_data_core", name
          assert find_data_file("bright_stars.csv") is not None
          assert earth_texture_path().is_file()
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          assert {"ssatk-demo-gallery", "ssatk-benchmark", "ssatk-magnetosphere"} <= scripts
          assert find_spec("ssapy_toolkit") is None, "the ssatk wheel must not ship the legacy alias"
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
